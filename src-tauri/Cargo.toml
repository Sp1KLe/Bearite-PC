[package]
name = "bearite-pc"
version = "1.2.0"
description = "Bearite-PC: fan-made launcher for Super Bear Adventure"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Embeds the frontend into the .exe. Enabled for release builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
